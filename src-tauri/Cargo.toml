[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["EonGreen0"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
sha2 = "0.10"
dirs = "6"

[target.'cfg(windows)'.dependencies]
png = "0.17.16"
windows = { version = "0.61.3", features = ["ApplicationModel_DataTransfer", "Foundation", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
